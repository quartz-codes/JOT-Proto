syntax = "proto3";

package jot.judge.v1;

option go_package = "github.com/judge-master/JOT-Proto/go/judge/v1;judgev1";

service JudgeService {
  rpc Judge(JudgeRequest) returns (stream JudgeEvent);
}

message JudgeRequest {
  // Set by the backend to correlate the request, stream, and logs.
  int64 request_id = 1;
  int64 problem_id = 2;
  repeated int64 subproblem_ids = 3;
  Language language = 4;
  string source_code = 5;
  uint64 compile_time_ms_limit = 6;
  uint64 build_artifact_bytes_limit = 7;
  uint64 instruction_count_limit = 8;
  uint64 memory_bytes_limit = 9;
  
}

enum Language {
  LANGUAGE_C = 0;
  LANGUAGE_CPP = 1;
  LANGUAGE_RUST = 2;
  LANGUAGE_GO = 3;
  LANGUAGE_PYTHON = 4;
}

// Output

message JudgeEvent {
  int64 request_id = 1;

  oneof payload {
    JudgeReceived received = 2;
    JudgeCompiling compiling = 3;
    JudgeTestcasesDownloading testcases_downloading = 4;
    JudgeRunning running = 5;
    JudgeResult result = 6;
  }
}

message JudgeReceived {
}

message JudgeCompiling {
}

message JudgeTestcasesDownloading {
}

message JudgeRunning {
  uint32 completed_cases = 1;
  uint32 total_cases = 2;
}

message JudgeResult {
  oneof verdict {
    JudgeComplete complete = 1;
    JudgeCompileError compile_error = 2;
    JudgeCompileTLE compile_tle = 3;
    JudgeCompileBLE compile_ble = 4;
    JudgeSystemError system_error = 5;
  }
}

message JudgeComplete {
  map<int64, SubproblemVerdict> subproblem_verdicts = 1;
}

message SubproblemVerdict {
  oneof subproblem_verdict {
    SubproblemCorrect correct = 1;
    SubproblemWrongAnswer wrong_answer = 2;
    SubproblemTLE time_limit_exceeded = 3;
    SubproblemMLE memory_limit_exceeded = 4;
    SubproblemRuntimeError runtime_error = 5;
  }
}

message SubproblemCorrect {
  uint64 max_memory_byte_used = 1;
  uint64 max_instruction_count_used = 2;
}

message SubproblemWrongAnswer {
}

message SubproblemTLE {
  uint64 max_instruction_count = 1;
}

message SubproblemMLE {
  uint64 max_memory_bytes = 1;
}

message SubproblemRuntimeError {
  string error_message = 1;
}

message JudgeCompileError {
  string compiler_diagnostics = 1;
}

message JudgeCompileTLE {
  uint64 max_compile_time_ms = 1;
}

message JudgeCompileBLE {
  uint64 max_build_artifact_bytes = 1;
}

message JudgeSystemError {
  string error_message = 1;
}